[build-system]
requires = ["setuptools>=64.0", "wheel"]

[project]
name = "pamr"
version = "1.0.0"
description = "PAMR: Path-Aware Multimodal Reasoning over VL-KGE (WikiArt-MKG-v2)"
authors = [{name = "Hai Dang Lam Huynh"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# FLOORS ONLY — this project is a uv-workspace member (root:
# /media02/hlhdang/projects/pyproject.toml). The root pins the torch triad
# (2.5.1+cu121 family, driver 535) and carries the numpy/transformers
# override floors; secondary deps float per the collective pin policy.
# transformers / salesforce-lavis are intentionally NOT runtime deps: the
# regen chain imports neither (zero-shot CLIP eval is out of campaign scope).
dependencies = [
    "numpy>=2.2.6,<3",
    "pandas>=2.2",
    "torch>=2.5,<3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
]

[project.scripts]
pamr-train = "pamr.scripts.train_embedding:main"
pamr-train-pamr = "pamr.scripts.train_pamr:main"

[tool.setuptools.packages.find]
include = ["pamr", "pamr.*"]

[tool.setuptools.package-data]
pamr = ["configs/**/*.yaml", "data/**/*"]
