# VL-KGE baseline scoring — Distmult (train scope)
# Negative-sampling-based evaluation — scoring config
# Loads a trained VL-KGE model and scores prepared queries.
#
# Scores land in an output-own per-model dir (June layout:
# full/vlkge/<Model>/). The prepare root keeps only prepared queries
# and metadata, so the four baseline chains never clobber each
# other's {split}_scores.csv and verify-C can reference the TransE
# chain's scores directly.
#
# Usage:
#   python -m pamr.models.vlkge.score --config configs/eval/wikiart_mkg_v2_score.yaml

# --- Referenced configs (no path duplication) ---
prepare_config: configs/eval/wikiart_mkg_v2_neg_sampling.yaml
model_config: configs/wikiart_mkg_v2/distmult_clip.yaml

# --- Score-specific settings ---
output_dir: ../checkpoints/preproc/wikiart_mkg_v2/full/vlkge/DistMult/
checkpoint_path: ../checkpoints/vlkge/wikiart_mkg_v2/distmult_wikiart_mkg_v2_train.pt

batch_size: 2048
seed: 42
