# Baseline metrics for the TransE score chain.
#
# evaluate.py ranks the per-model {split}_scores.csv written by
# configs/eval/wikiart_mkg_v2_score.yaml (scores_dir below points
# at that chain's output-own dir). One config per baseline so the four
# metrics.json files never overwrite each other.

# --- Referenced configs (no path duplication) ---
prepare_config: configs/eval/wikiart_mkg_v2_neg_sampling.yaml

# --- Scores source ---
scores_dir: ../checkpoints/preproc/wikiart_mkg_v2/full/vlkge/TransE/

top_k: [1, 3, 5, 10]
seed: 42
