# Negative-sampling-based evaluation protocol — evaluate config
# Reads pre-computed scores and computes MRR, Hits@K, and accuracy.
#
# scores_dir is NOT duplicated — scores are read from
# prepare_cfg.output_dir (same directory as query CSVs).
#
# Usage:
#   python -m pamr.scripts.evaluate --config configs/eval/wikiart_mkg_v2_neg_eval.yaml

# Reference to prepare config (paths are extracted from here — no duplication)
prepare_config: configs/eval/wikiart_mkg_v2_neg_sampling.yaml

# K thresholds for Hits@K reporting
top_k: [1, 3, 5, 10]

seed: 42
