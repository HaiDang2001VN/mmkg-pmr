# PAMR second seed for minimal std (n=2 seeds: 42 + 1)
#
# Transformer over interleaved entity/edge paths with frozen VLKGE embeddings.
# d_model auto-detected from VLKGE (ComplEx → 1536).
#
# Usage:
#   python -m pamr.scripts.train_pamr --config configs/pr/pamr.yaml

# ── Architecture ────────────────────────────────────────────────────────────
num_layers: 8
num_heads: 8              # 1536/8 = 192 per head
dim_feedforward: 2048
dropout: 0.1
causal: false
readout: average
use_node_types: true

# ── VLKGE (frozen embedding source) ────────────────────────────────────────
# Backbone = frozen TransE, train scope — matches the submitted paper's
# description (TransE, D = 768 → d = 768 auto-detected; 768/8 = 96 per head).
# NOTE: the June artifact campaign actually ran on the frozen ComplEx
# checkpoint (d_model=1536); the locked regeneration plan is TransE-faithful,
# so results are a new configuration relative to the published numbers.
vlkge_config: ../wikiart_mkg_v2/transe_clip.yaml
vlkge_checkpoint: ../checkpoints/vlkge/wikiart_mkg_v2/transe_wikiart_mkg_v2_train.pt
# Scope of facts the VLKGE checkpoint was trained on. Must match the
# checkpoint's recorded embedding_scope. Locked protocol (2026-10-03):
# train-scope checkpoints back BOTH val and test evaluation and all
# baseline scoring; no matched-scope (train_val) pairing.
vlkge_scope: train

# ── Path data (full production) ────────────────────────────────────────────
paths_dir: ../checkpoints/preproc/wikiart_mkg_v2/full/pamr/
queries_dir: ../checkpoints/preproc/wikiart_mkg_v2/full/
max_hops: 5
max_tokens: 13

# ── Training ───────────────────────────────────────────────────────────────
# Objective: grouped_pairwise | listwise_softmax | binary_candidate
# (probe-level binary / link_prediction / reconstruction remain available).
loss_mode: grouped_pairwise
# Minimum candidate coverage required to accept a best-checkpoint (0 = off).
min_eval_coverage: 0.95
patience: 5               # early stopping on val-MRR plateaus (0 = off)
# Candidate-level losses receive complete per-query candidate groups.
group_batches: true
# Length-first composite handling of no-path candidates:
# exclude (default) ranks only reachable positives; infinite ranks
# no-path candidates last with score tie-breaks.
lf_no_path_policy: exclude
batch_size: 8
eval_batch_size: 1024     # val/test loaders; large batches are safe (pad-only)
lr: 0.01
epochs: 50
eval_every: 1
eval_max_batches: 999999  # full val/test

# ── Relation filter (eval-only: train on all, eval on 4 artist relations)
relation_filter:
  mode: train_eval
  relations:
    - isInfluencedBy
    - isInfluencedOn
    - isPupilOf
    - isTeacherOf

# ── Output ─────────────────────────────────────────────────────────────────
log_metrics: true
save_checkpoint: true

weight_decay: 0.01

seed: 1
