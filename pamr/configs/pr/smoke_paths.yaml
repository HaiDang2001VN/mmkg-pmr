# Smoke test config for PR preprocess
# Small thread count, absolute GDrive paths, output to checkpoints/preproc/

graph_csv: ../data/wikiart_mkg_v2/wikiart_mkg_v2_triples.csv

prepare_config: configs/eval/smoke_neg_sampling.yaml

max_hops: 3
max_fanout: 10
decay_factor: 0.5

# Smoke inherits the production masking policy: own edges masked per probe
# in every split; target-relation traversal allowed uniformly.
path_graph:
  mask_query_edges: true
  allow_target_relation_traversal: true

num_threads: 8

cpp_source: pamr/models/pr/preprocess.cpp
binary_path: pamr/models/pr/preprocess.o
compile_flags: "-std=c++23 -O3 -pthread"

output_dir: ../checkpoints/preproc/wikiart_mkg_v2/smoke/
keep_temp: true
seed: 42
